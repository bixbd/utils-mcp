name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint
      - run: bun run check:connectors
      - run: bun run typecheck
      - run: bun run test
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: bun tools/guard/src/cli.ts commits "origin/${{ github.base_ref }}..HEAD"
